# Un comando: docker compose up --build  →  http://localhost:3000
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reto01
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/reto01
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      DEMO_USERS: ${DEMO_USERS:-}
      AS_OF_DATE: ${AS_OF_DATE:-}
      MAX_ITERATIONS_PER_TURN: ${MAX_ITERATIONS_PER_TURN:-25}
      MAX_TOKENS_PER_SESSION: ${MAX_TOKENS_PER_SESSION:-200000}
